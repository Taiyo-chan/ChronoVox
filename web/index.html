<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ChronoVox</title>
  <meta name="theme-color" content="#0B1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ChronoVox" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./icon.png" alt="ChronoVox Icon" />
        <span>ChronoVox</span>
      </div>
      <select id="headerLangSelect" class="lang-quick-select" aria-label="Language"></select>
    </header>

    <main id="mainContent" class="main-content"></main>

    <nav id="bottomTabBar" class="tabbar"></nav>
  </div>

  <div id="modalContainer"></div>

  <script src="./i18n.js"></script>
  <script src="./app.js"></script>
</body>
</html>
